  #     - POSTGRES_DB=rental_hub
  #     - POSTGRES_USER=karasko
  #     - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  api_data:
  api_uploads:
